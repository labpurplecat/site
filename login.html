<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finspots | Entrar na Minha Central</title>
<meta name="description" content="Entre na Minha Central Finspots com um link de acesso enviado por e-mail, sem senha.">
<link rel="icon" type="image/png" href="assets/img/finspots-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #071730;
    --quase-preto: #00031B;
    --laranja: #FF5500;
    --laranja-fraco: rgba(255,85,0,0.13);
    --branco: #FFFFFF;
    --suave: #A9B2D6;
    --fraco: #6B76A8;
    --borda: rgba(255,255,255,0.09);
    --verde: #2ECC71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background-color: var(--azul); color: var(--branco);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--laranja); outline-offset: 3px; }

  .wrap-estreito { max-width: 460px; margin: 0 auto; padding: 0 24px; }
  section { padding: 60px 0; }
  .central { text-align: center; }

  h1 { font-size: clamp(24px, 3.6vw, 30px); font-weight: 800; }
  p { color: var(--suave); font-size: 15px; }

  .icone-topo {
    width: 46px; height: 46px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--laranja-fraco);
  }
  .icone-topo svg { width: 22px; height: 22px; stroke: var(--laranja); }

  .btn {
    display: inline-block; font-family: inherit; font-size: 15px; font-weight: 600;
    text-decoration: none; padding: 15px 30px; border-radius: 10px; border: none; cursor: pointer; width: 100%;
  }
  .btn-primario { background: var(--laranja); color: var(--branco); }
  .btn-primario:disabled { background: var(--fraco); cursor: not-allowed; opacity: 0.6; }

  header { padding: 26px 0; text-align: center; }
  .logo { font-size: 21px; font-weight: 800; text-decoration: none; display: inline-block; }
  .logo img { height: 42px; }

  .campo-email { margin: 28px 0 20px; text-align: left; }
  .campo-email label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .campo-email-input { position: relative; }
  .campo-email-input svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--fraco); pointer-events: none;
  }
  .campo-email input {
    width: 100%; background: var(--quase-preto); border: 1px solid var(--borda); border-radius: 8px;
    padding: 12px 14px 12px 40px; color: var(--branco); font-family: inherit; font-size: 14px;
  }
  .campo-email input:focus ~ svg { stroke: var(--laranja); }

  .btn-icone { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-icone svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }

  .link-secundario {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    color: var(--suave); text-decoration: none;
  }
  .link-secundario svg { width: 15px; height: 15px; stroke: var(--laranja); flex-shrink: 0; }
  .link-secundario a { color: var(--laranja); text-decoration: underline; }

  footer { padding: 30px 0; text-align: center; font-size: 12.5px; color: var(--fraco); }
  #bg-fundo {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: var(--azul) url('assets/img/fundo-ondas.jpg') center / cover no-repeat;
  }

</style>
</head>
<body>
<div id="bg-fundo" aria-hidden="true"></div>


<header>
  <a href="index.html" class="logo"><img src="assets/img/finspots-logo.png" alt="Finspots"></a>
</header>

<section class="central">
  <div class="wrap-estreito">

    <div class="icone-topo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>

    <h1>Entrar na Minha Central Finspots</h1>
    <p style="margin-top:10px;">Digite seu e-mail e receba um link de acesso.</p>

    <div class="campo-email">
      <label for="email-login">Seu e-mail</label>
      <div class="campo-email-input">
        <input type="email" id="email-login" placeholder="voce@email.com" autocomplete="email">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
      </div>
    </div>

    <button class="btn btn-primario btn-icone" id="btn-enviar-link">
      Enviar link de acesso
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
    </button>
    <p id="mensagem-login" style="display:none; margin-top:16px; font-size:13.5px;"></p>

    <p class="link-secundario" style="margin-top:28px; font-size:13px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      Ficou com dúvida? <a href="https://wa.me/5562996677168" target="_blank" rel="noopener">Chama no WhatsApp</a>
    </p>
    <p class="link-secundario" style="margin-top:12px; font-size:13px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      Ainda não é cliente? <a href="index.html">Conheça a Finspots</a>
    </p>
  </div>
</section>

<footer>Finspots | Inteligência de Vendas e Finanças para E-commerce</footer>

<script>
  var API_URL = 'https://saf-production.up.railway.app';

  var input = document.getElementById('email-login');
  var btn = document.getElementById('btn-enviar-link');
  var msg = document.getElementById('mensagem-login');

  function emailValido(valor) {
    return valor.indexOf('@') > 0 && valor.lastIndexOf('.') > valor.indexOf('@');
  }

  function mostrarMensagem(texto, cor) {
    msg.textContent = texto;
    msg.style.color = cor;
    msg.style.display = 'block';
  }

  function enviarLink() {
    if (!emailValido(input.value)) {
      mostrarMensagem('Digite um email válido.', 'var(--laranja)');
      return;
    }

    btn.disabled = true;
    var textoOriginal = btn.textContent;
    btn.textContent = 'Enviando...';
    msg.style.display = 'none';

    fetch(API_URL + '/auth/solicitar-link?email=' + encodeURIComponent(input.value), { method: 'POST' })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('status ' + resposta.status);
        return resposta.json();
      })
      .then(function () {
        mostrarMensagem('Se esse email tiver uma conta, o link chegou na caixa de entrada. Pode fechar essa aba.', 'var(--verde)');
        btn.textContent = 'Link enviado';
      })
      .catch(function (erro) {
        console.error('Falha ao solicitar link de acesso:', erro);
        btn.disabled = false;
        btn.textContent = textoOriginal;
        mostrarMensagem('Não foi possível enviar o link agora. Tenta de novo em instantes, ou chama no WhatsApp se continuar.', 'var(--laranja)');
      });
  }

  btn.addEventListener('click', enviarLink);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') enviarLink();
  });
</script>

</body>
</html>
