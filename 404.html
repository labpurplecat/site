<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Finspots</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden}
svg{position:fixed;inset:0;width:100%;height:100%}
.grid line{stroke:#1c2333;stroke-width:1}
.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 6s ease-in-out infinite}
.l1{stroke:url(#g1)}
.l2{stroke:url(#g2);opacity:.55;animation-delay:.8s}
.area{fill:url(#fa);opacity:0;animation:fade 6s ease-in-out infinite}
.bar{fill:#6d5dfc;opacity:.18;transform-origin:bottom;transform-box:fill-box;animation:grow 3s ease-in-out infinite alternate}
@keyframes draw{0%{stroke-dashoffset:1600}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1600}}
@keyframes fade{0%,20%{opacity:0}45%,80%{opacity:1}100%{opacity:0}}
@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
</style>
</head>
<body>
<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs>
<g class="grid">
<line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="360" x2="1000" y2="360"/><line x1="0" y1="480" x2="1000" y2="480"/>
<line x1="125" y1="0" x2="125" y2="600"/><line x1="250" y1="0" x2="250" y2="600"/><line x1="375" y1="0" x2="375" y2="600"/><line x1="500" y1="0" x2="500" y2="600"/><line x1="625" y1="0" x2="625" y2="600"/><line x1="750" y1="0" x2="750" y2="600"/><line x1="875" y1="0" x2="875" y2="600"/>
</g>
<g>
<rect class="bar" x="95" y="380" width="60" height="220" style="animation-delay:0s"/>
<rect class="bar" x="220" y="330" width="60" height="270" style="animation-delay:.4s"/>
<rect class="bar" x="345" y="400" width="60" height="200" style="animation-delay:.8s"/>
<rect class="bar" x="470" y="280" width="60" height="320" style="animation-delay:1.2s"/>
<rect class="bar" x="595" y="320" width="60" height="280" style="animation-delay:1.6s"/>
<rect class="bar" x="720" y="230" width="60" height="370" style="animation-delay:2s"/>
<rect class="bar" x="845" y="180" width="60" height="420" style="animation-delay:2.4s"/>
</g>
<path class="area" d="M0,430 C80,420 110,350 180,360 S300,420 370,380 S480,250 560,280 S680,330 740,250 S880,150 1000,120 L1000,600 L0,600 Z"/>
<path class="line l1" d="M0,430 C80,420 110,350 180,360 S300,420 370,380 S480,250 560,280 S680,330 740,250 S880,150 1000,120"/>
<path class="line l2" d="M0,480 C90,470 140,440 210,450 S330,380 400,410 S520,360 590,330 S700,360 770,310 S890,250 1000,230"/>
</svg>
</body>
</html>
